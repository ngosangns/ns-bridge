name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  omp-smoke:
    # Loads dist/index.js in a real OMP (`omp models -e`) under a temp HOME.
    runs-on: ubuntu-latest
    needs: test
    env:
      OMP_VERSION: 18.8.4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install omp
        run: |
          bun install -g "@oh-my-pi/pi-coding-agent@${OMP_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: omp --version
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
