name: Publish

# Publishes ns-omp-provider to npm with provenance. Two auth modes:
#
# 1. `NPM_TOKEN` repository secret (configured): a granular npm token with
#    package write + "bypass 2FA". setup-node writes an .npmrc that reads it
#    from NODE_AUTH_TOKEN. This is what makes the very first publish possible
#    from CI, since npm cannot attach a trusted publisher to a package that
#    does not exist yet.
# 2. npm trusted publishing (OIDC): once the package exists you can run
#      npm trust github ns-omp-provider --file publish.yml \
#        --repo ngosangns/ns-omp-provider --allow-publish
#    npm >= 11.5 tries OIDC first and falls back to NODE_AUTH_TOKEN, so the
#    secret can then be deleted without touching this workflow.
#
# Trigger by pushing a tag that matches package.json:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json is $version but the tag says $tag"
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p tarballs
          npm pack --pack-destination tarballs
          ls -l tarballs

      - name: Verify packed package declares this repository
        run: |
          expected="https://github.com/${{ github.repository }}"
          tarball=(tarballs/ns-omp-provider-*.tgz)
          url=$(tar -xzOf "${tarball[0]}" package/package.json | node -p "(JSON.parse(require('fs').readFileSync(0,'utf8')).repository || {}).url || ''")
          normalized="${url#git+}"
          normalized="${normalized%.git}"
          echo "${tarball[0]} -> ${normalized:-<none>}"
          if [ "$normalized" != "$expected" ]; then
            echo "::error::tarball declares '${url:-<none>}' but provenance requires $expected"
            exit 1
          fi

      - name: Publish
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "auth: NPM_TOKEN secret present (OIDC still preferred if a trusted publisher is configured)"
            echo "npm whoami: $(npm whoami)"
          else
            echo "auth: no NPM_TOKEN secret, relying on npm trusted publishing (OIDC)"
          fi
          dry_run=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run="--dry-run"
            echo "dry run: npm will validate the publish without uploading"
          fi
          # `./` is load-bearing: a bare `tarballs/name.tgz` looks like owner/repo to npm.
          npm publish ./tarballs/ns-omp-provider-*.tgz --access public --provenance $dry_run
        env:
          # Empty when the NPM_TOKEN secret is absent; npm then uses OIDC only.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
