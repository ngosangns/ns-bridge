name: Publish

# Publishes @ngosangns/ns-bridge via trusted publishing (OIDC). No npm token
# is stored. The trusted publisher on that package must name this repository
# (ngosangns/ns-bridge) and this file (.github/workflows/publish.yml).
#
# The provider packages are no longer released. To release the CLI:
#   1. bump "version" in packages/cli/package.json;
#   2. commit and push to main;
#   3. push one tag, scope dropped:
#        git tag ns-bridge@<version> && git push origin ns-bridge@<version>
#   0.1.3 (tag ns-bridge@0.1.3) is already on npm. Do not republish
#   0.1.0, 0.1.1, or 0.1.2.
#
# scripts/release-plan.mjs refuses a tag that is not that package at a version
# npm does not have yet. A package npm has never seen cannot be created by
# OIDC; its first version is published by hand and the trusted publisher is
# registered after.

on:
  push:
    tags: ["ns-bridge@*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: [self-hosted, macmini]
    permissions:
      # Required for OIDC: this is what npm trusts in place of a token.
      # (Provenance attestation is not available — sigstore only accepts
      # github-hosted runners, and this job runs on the self-hosted macmini.)
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `check` typechecks against built declarations, so the build comes first.
      - run: pnpm -r build
      - run: pnpm -r check
      - run: pnpm test

      - name: Plan
        id: plan
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/release-plan.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/release-plan.mjs
          fi
          echo "plan=$(node scripts/release-plan.mjs --json)" >> "$GITHUB_OUTPUT"

      # `pnpm pack`, not `npm pack`: dependents reference the cores through
      # `workspace:*`, and only pnpm rewrites that to the real version. Packing
      # with npm would publish the literal `workspace:*` and the package would
      # be uninstallable.
      - name: Pack
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          mkdir -p tarballs
          for dir in $(node -p "JSON.parse(process.env.PLAN).map((e) => e.dir).join(' ')"); do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          done
          ls -l tarballs

      # Two ways a packed manifest can be unpublishable: a `workspace:` range
      # pnpm failed to rewrite, or a pin on a sibling version that is neither on
      # npm nor in this run. And a repository.url that does not name this repo
      # fails OIDC verification only at the real upload, so catch it here.
      - name: Verify the packed manifests
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          EXPECTED_REPO: https://github.com/${{ github.repository }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readdirSync } from "node:fs";
            const plan = JSON.parse(process.env.PLAN);
            const pending = new Set(plan.map((e) => `${e.name}@${e.version}`));
            const siblings = new Set(plan.map((e) => e.name));
            let failed = false;
            const fail = (msg) => { console.log(`::error::${msg}`); failed = true; };
            for (const file of readdirSync("tarballs")) {
              const manifest = JSON.parse(execFileSync("tar", ["-xzOf", `tarballs/${file}`, "package/package.json"], { encoding: "utf8" }));
              const url = ((manifest.repository || {}).url || "").replace(/^git\+/, "").replace(/\.git$/, "");
              if (url !== process.env.EXPECTED_REPO) fail(`${file} declares repository "${url}", expected ${process.env.EXPECTED_REPO}`);
              const runtime = { ...manifest.dependencies, ...manifest.optionalDependencies, ...manifest.peerDependencies };
              // An optional peer is never installed for the package, so it
              // need not be on npm yet.
              const optionalPeers = new Set(
                Object.entries(manifest.peerDependenciesMeta || {}).filter(([, meta]) => meta && meta.optional).map(([dep]) => dep),
              );
              for (const [dep, range] of Object.entries(runtime)) {
                if (String(range).startsWith("workspace:")) fail(`${file} still carries ${dep}@${range}`);
                if (optionalPeers.has(dep) && !(manifest.dependencies || {})[dep] && !(manifest.optionalDependencies || {})[dep]) continue;
                if (!dep.startsWith("ns-") && !dep.startsWith("@ngosangns/")) continue;
                if (pending.has(`${dep}@${range}`)) continue;
                try {
                  execFileSync("npm", ["view", `${dep}@${range}`, "version"], { stdio: "ignore" });
                } catch {
                  if (!siblings.has(dep)) fail(`${file} pins ${dep}@${range}, which is neither on npm nor in this run`);
                }
              }
              console.log(`${file}: ok`);
            }
            process.exit(failed ? 1 : 0);
          '

      # Order comes from the plan: dependencies before the packages that pin them.
      #
      # The `./` on the path is load-bearing. A bare `tarballs/name-x.tgz` looks
      # like `owner/repo` to npm, which resolves it as a git dependency and
      # fails with EALLOWGIT instead of reading the file.
      - name: Publish
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          dry_run=""
          if [ "${DRY_RUN}" = "true" ]; then
            dry_run="--dry-run"
            echo "dry run: npm will validate the publish without uploading"
          fi
          node -p "JSON.parse(process.env.PLAN).map((e) => e.name.replace('@', '').replace('/', '-') + '-' + e.version + '.tgz').join('\n')" |
          while read -r tarball; do
            [ -n "$tarball" ] || continue
            echo "publishing $tarball"
            npm publish "./tarballs/$tarball" --access public --no-provenance $dry_run
          done
