packages:
  - packages/*

# The omp and pi host packages are here for their type declarations only — the bundle
# marks them external — so their native transitive builds are dead weight.
allowBuilds:
  "@google/genai": false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - '@oh-my-pi/omp-stats@18.2.7'
  - '@oh-my-pi/omptype@18.2.7'
  - '@oh-my-pi/pi-agent-core@18.2.7'
  - '@oh-my-pi/pi-ai@18.2.7'
  - '@oh-my-pi/pi-catalog@18.2.7'
  - '@oh-my-pi/pi-coding-agent@18.2.7'
  - '@oh-my-pi/pi-mnemopi@18.2.7'
  - '@oh-my-pi/pi-natives-darwin-arm64@18.2.7'
  - '@oh-my-pi/pi-natives-darwin-x64@18.2.7'
  - '@oh-my-pi/pi-natives-linux-arm64@18.2.7'
  - '@oh-my-pi/pi-natives-linux-x64@18.2.7'
  - '@oh-my-pi/pi-natives-win32-arm64@18.2.7'
  - '@oh-my-pi/pi-natives-win32-x64@18.2.7'
  - '@oh-my-pi/pi-natives@18.2.7'
  - '@oh-my-pi/pi-tui@18.2.7'
  - '@oh-my-pi/pi-utils@18.2.7'
  - '@oh-my-pi/pi-wire@18.2.7'
  - '@oh-my-pi/snapcompact@18.2.7'
  - '@earendil-works/chord@1.1.0'
  - '@earendil-works/pi-agent-core@1.1.0'
  - '@earendil-works/pi-ai@1.1.0'
  - '@earendil-works/pi-codemode@1.1.0'
  - '@earendil-works/pi-coding-agent@1.1.0'
  - '@earendil-works/pi-mcp@1.1.0'
  - '@earendil-works/pi-telemetry@1.1.0'
  - '@earendil-works/pi-tui@1.1.0'
